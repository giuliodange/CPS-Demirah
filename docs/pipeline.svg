<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" font-family="Menlo, Consolas, monospace"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker></defs><rect x="10" y="10" width="1420" height="450" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="30" y="44" font-size="18" font-weight="bold" text-anchor="start" fill="#111111">DEMIRAH: DATA FLOW</text><rect x="287" y="75" width="640" height="330" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="7,5"/><text x="300" y="396" font-size="11" font-weight="bold" text-anchor="start" fill="#111111">LAPTOP</text><rect x="40" y="200" width="180" height="80" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="130.0" y="237.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">ESP32-CAM</text><text x="130.0" y="253.0" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">camera on the mirror head</text><rect x="300" y="200" width="190" height="80" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="395.0" y="230.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">face_tracker.py</text><text x="395.0" y="246.0" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">Python, MediaPipe</text><text x="395.0" y="260.0" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">face position, 15 scores</text><rect x="540" y="100" width="180" height="80" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="630.0" y="130.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">Wekinator</text><text x="630.0" y="146.0" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">k-NN classifier</text><text x="630.0" y="160.0" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">4 expression classes</text><rect x="730" y="200" width="185" height="80" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="822.5" y="230.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">mirror.pde</text><text x="822.5" y="246.0" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">Processing</text><text x="822.5" y="260.0" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">states, motion, light</text><rect x="1040" y="200" width="180" height="80" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="1130.0" y="230.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">mirror.ino</text><text x="1130.0" y="246.0" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">Arduino Nano Every</text><text x="1130.0" y="260.0" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">executes within limits</text><polyline points="220,240 300,240" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#head)"/><text x="253" y="232" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">Wi-Fi</text><text x="253" y="256" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">MJPEG</text><polyline points="395,200 395,140 540,140" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#head)"/><text x="468" y="132" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">15 blendshape scores</text><text x="468" y="119" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">OSC /wek/inputs</text><polyline points="720,140 822,140 822,200" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#head)"/><text x="800" y="132" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">class 1 to 4</text><text x="800" y="119" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">OSC /wek/outputs</text><polyline points="490,240 730,240" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#head)"/><text x="610" y="232" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">OSC /face</text><text x="610" y="256" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">present, cx, cy, size</text><polyline points="915,240 1040,240" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#head)"/><text x="984" y="232" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">USB serial</text><text x="984" y="256" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">115200 baud</text><text x="984" y="271" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">x,y,r,g,b,c,</text><text x="984" y="284" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">phase,mix</text><rect x="1280" y="70" width="140" height="60" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="1350.0" y="97.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">Stepper X</text><text x="1350.0" y="113.0" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">base rotation</text><polyline points="1250,100 1280,100" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#head)"/><rect x="1280" y="160" width="140" height="60" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="1350.0" y="187.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">Stepper Y</text><text x="1350.0" y="203.0" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">head tilt</text><polyline points="1250,190 1280,190" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#head)"/><rect x="1280" y="250" width="140" height="60" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="1350.0" y="277.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">Servo</text><text x="1350.0" y="293.0" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">mirror curvature</text><polyline points="1250,280 1280,280" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#head)"/><rect x="1280" y="340" width="140" height="60" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="1350.0" y="367.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">75 LEDs</text><text x="1350.0" y="383.0" font-size="10" font-weight="normal" text-anchor="middle" fill="#111111">WS2812B ring</text><polyline points="1250,370 1280,370" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#head)"/><polyline points="1220,240 1250,240" fill="none" stroke="#111111" stroke-width="1.5"/><polyline points="1250,100 1250,370" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="440" font-size="10" font-weight="normal" text-anchor="start" fill="#111111">The camera turns with the mirror, so the loop from camera to motors is closed: the mirror moves until the face is at the centre of the image.</text></svg>